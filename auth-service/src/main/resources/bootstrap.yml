spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: true
      retry:
        max-attempts: 10
        multiplier: 1.5
        initial-interval: 2000
        max-interval: 10000

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka

jwt:
  secret: mysupersecretkeywhichislongenough

admin:
  email: admin@villagebasket.com
  password: admin123
